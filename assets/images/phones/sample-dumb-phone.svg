<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" fill="none">
  <rect width="200" height="280" rx="16" fill="#f1f5f9"/>
  <!-- Phone body -->
  <rect x="50" y="25" width="100" height="230" rx="18" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <rect x="54" y="29" width="92" height="222" rx="15" fill="#334155"/>
  <!-- Screen -->
  <rect x="62" y="45" width="76" height="60" rx="6" fill="#0f172a"/>
  <rect x="65" y="48" width="70" height="54" rx="4" fill="#0284c7" opacity="0.85"/>
  <!-- Screen content: simple clock -->
  <text x="100" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">12:45</text>
  <text x="100" y="94" font-family="sans-serif" font-size="8" fill="#e0f2fe" text-anchor="middle">שיחות והודעות</text>
  <!-- D-pad navigation -->
  <circle cx="100" cy="126" r="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <circle cx="100" cy="126" r="5" fill="#94a3b8"/>
  <rect x="65" y="118" width="14" height="7" rx="2" fill="#22c55e"/>
  <rect x="121" y="118" width="14" height="7" rx="2" fill="#ef4444"/>
  <!-- Keypad buttons -->
  <g fill="#475569" stroke="#1e293b" stroke-width="1">
    <!-- Row 1 -->
    <rect x="65" y="150" width="20" height="15" rx="3"/>
    <rect x="90" y="150" width="20" height="15" rx="3"/>
    <rect x="115" y="150" width="20" height="15" rx="3"/>
    <!-- Row 2 -->
    <rect x="65" y="172" width="20" height="15" rx="3"/>
    <rect x="90" y="172" width="20" height="15" rx="3"/>
    <rect x="115" y="172" width="20" height="15" rx="3"/>
    <!-- Row 3 -->
    <rect x="65" y="194" width="20" height="15" rx="3"/>
    <rect x="90" y="194" width="20" height="15" rx="3"/>
    <rect x="115" y="194" width="20" height="15" rx="3"/>
    <!-- Row 4 -->
    <rect x="65" y="216" width="20" height="15" rx="3"/>
    <rect x="90" y="216" width="20" height="15" rx="3"/>
    <rect x="115" y="216" width="20" height="15" rx="3"/>
  </g>
  <!-- Speaker -->
  <line x1="88" y1="36" x2="112" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>
