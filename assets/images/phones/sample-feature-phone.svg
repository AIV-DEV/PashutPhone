<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" fill="none">
  <rect width="200" height="280" rx="16" fill="#f8fafc"/>
  <!-- Phone body: sleek modern feature phone -->
  <rect x="48" y="20" width="104" height="240" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
  <rect x="52" y="24" width="96" height="232" rx="18" fill="#1e293b"/>
  <!-- Screen: 2.8 inch proportion -->
  <rect x="58" y="38" width="84" height="96" rx="8" fill="#020617"/>
  <rect x="62" y="42" width="76" height="88" rx="6" fill="#0f766e" opacity="0.9"/>
  <!-- Screen graphics -->
  <circle cx="100" cy="72" r="16" fill="#ffffff" opacity="0.2"/>
  <text x="100" y="77" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">10:15</text>
  <text x="100" y="98" font-family="sans-serif" font-size="9" fill="#ccfbf1" text-anchor="middle">תפריט ראשי</text>
  <rect x="74" y="112" width="52" height="6" rx="3" fill="#5eead4" opacity="0.6"/>
  <!-- Central controls -->
  <rect x="86" y="146" width="28" height="20" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <rect x="60" y="146" width="20" height="10" rx="3" fill="#22c55e"/>
  <rect x="120" y="146" width="20" height="10" rx="3" fill="#ef4444"/>
  <!-- Keypad buttons (chicklet style) -->
  <g fill="#334155" stroke="#475569" stroke-width="1">
    <rect x="60" y="174" width="22" height="15" rx="4"/>
    <rect x="89" y="174" width="22" height="15" rx="4"/>
    <rect x="118" y="174" width="22" height="15" rx="4"/>

    <rect x="60" y="195" width="22" height="15" rx="4"/>
    <rect x="89" y="195" width="22" height="15" rx="4"/>
    <rect x="118" y="195" width="22" height="15" rx="4"/>

    <rect x="60" y="216" width="22" height="15" rx="4"/>
    <rect x="89" y="216" width="22" height="15" rx="4"/>
    <rect x="118" y="216" width="22" height="15" rx="4"/>

    <rect x="60" y="237" width="22" height="15" rx="4"/>
    <rect x="89" y="237" width="22" height="15" rx="4"/>
    <rect x="118" y="237" width="22" height="15" rx="4"/>
  </g>
  <!-- Speaker -->
  <line x1="90" y1="28" x2="110" y2="28" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
